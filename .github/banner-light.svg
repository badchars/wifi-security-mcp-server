<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <!-- Accent gradient -->
    <linearGradient id="accent-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Icon glow (softer for light mode) -->
    <filter id="icon-glow-light">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Pill backgrounds -->
    <linearGradient id="lpill-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="lpill-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="lpill-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
    <linearGradient id="lpill-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="url(#bg-light)"/>

  <!-- Outer border -->
  <rect x="0.5" y="0.5" width="799" height="319" rx="0" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Grid lines -->
  <g stroke="#0891b2" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
  </g>

  <!-- Subtle glow orbs -->
  <circle cx="200" cy="140" r="120" fill="#0891b2" opacity="0.025"/>
  <circle cx="200" cy="140" r="70" fill="#0891b2" opacity="0.03"/>
  <circle cx="620" cy="160" r="100" fill="#2563eb" opacity="0.025"/>
  <circle cx="620" cy="160" r="55" fill="#2563eb" opacity="0.03"/>

  <!-- Top border accent -->
  <rect x="0" y="0" width="800" height="2" fill="url(#accent-light)"/>
  <!-- Bottom border accent -->
  <rect x="0" y="318" width="800" height="2" fill="url(#accent-light)"/>

  <!-- WiFi icon (radio waves) -->
  <g transform="translate(400, 75)" filter="url(#icon-glow-light)">
    <!-- Outer arc -->
    <path d="M-32,-8 A45,45 0 0,1 32,-8" fill="none" stroke="#0891b2" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
    <!-- Middle arc -->
    <path d="M-22,2 A30,30 0 0,1 22,2" fill="none" stroke="#2563eb" stroke-width="2.5" opacity="0.6" stroke-linecap="round"/>
    <!-- Inner arc -->
    <path d="M-12,12 A16,16 0 0,1 12,12" fill="none" stroke="#0891b2" stroke-width="2.5" opacity="0.7" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="0" cy="22" r="4" fill="#0891b2" opacity="0.8"/>
    <!-- Shield outline around WiFi -->
    <path d="M0,-32 L-36,-18 L-36,10 C-36,30 -12,44 0,50 C12,44 36,30 36,10 L36,-18 Z"
          fill="none" stroke="url(#accent-light)" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Title -->
  <text x="400" y="152" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="28" font-weight="700" fill="#1e293b" letter-spacing="-0.5">wifi-security-mcp-server</text>

  <!-- Subtitle -->
  <text x="400" y="176" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" letter-spacing="0.5">Wireless Security Intelligence for AI Agents</text>

  <!-- Accent line -->
  <rect x="310" y="189" width="180" height="2" rx="1" fill="url(#accent-light)" opacity="0.5"/>

  <!-- Stats pills row -->
  <g transform="translate(400, 216)">
    <!-- 34 Tools (cyan) -->
    <g transform="translate(-185, 0)">
      <rect x="-38" y="-12" width="76" height="24" rx="12" fill="url(#lpill-cyan)" stroke="#67e8f9" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0891b2">34 Tools</text>
    </g>
    <!-- 9 KBs (blue) -->
    <g transform="translate(-88, 0)">
      <rect x="-30" y="-12" width="60" height="24" rx="12" fill="url(#lpill-blue)" stroke="#93c5fd" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#2563eb">9 KBs</text>
    </g>
    <!-- MCP (purple) -->
    <g transform="translate(0, 0)">
      <rect x="-28" y="-12" width="56" height="24" rx="12" fill="url(#lpill-purple)" stroke="#c4b5fd" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7c3aed">MCP</text>
    </g>
    <!-- CLI (violet) -->
    <g transform="translate(82, 0)">
      <rect x="-24" y="-12" width="48" height="24" rx="12" fill="url(#lpill-violet)" stroke="#c4b5fd" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7c3aed">CLI</text>
    </g>
  </g>

  <!-- Protocol names -->
  <text x="400" y="260" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="9.5" fill="#94a3b8" letter-spacing="0.8">WiFi · Bluetooth · RF/SDR · NFC · Cellular · IoT · UWB · Drone RF</text>

  <!-- Decorative corner dots -->
  <circle cx="20" cy="20" r="1.5" fill="#0891b2" opacity="0.2"/>
  <circle cx="780" cy="20" r="1.5" fill="#2563eb" opacity="0.2"/>
  <circle cx="20" cy="300" r="1.5" fill="#2563eb" opacity="0.2"/>
  <circle cx="780" cy="300" r="1.5" fill="#0891b2" opacity="0.2"/>
</svg>
